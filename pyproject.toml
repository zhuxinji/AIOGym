[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiogym"
version = "0.2.0"
description = "Scenario-oriented process-control models, tasks, datasets, and workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "AIO-Gym Contributors" }
]

dependencies = [
  "gymnasium>=0.29",
  "numpy>=1.24",
]

[project.optional-dependencies]
oracle = [
  "casadi>=3.6",
]
rl = [
  "stable-baselines3>=2.3",
  "torch>=2.2",
]
onnx = [
  "onnx>=1.16",
  "onnxruntime>=1.17",
]
hpo = [
  "optuna>=4.0",
]
test = [
  "pytest>=8.0",
]
all = [
  "casadi>=3.6",
  "stable-baselines3>=2.3",
  "torch>=2.2",
  "onnx>=1.16",
  "onnxruntime>=1.17",
  "optuna>=4.0",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.12",
  "wheel>=0.45",
]

[project.urls]
Homepage = "https://github.com/zhuxinji/AIO-gym-temp"
Documentation = "https://github.com/zhuxinji/AIO-gym-temp/blob/main/docs/index.md"
Repository = "https://github.com/zhuxinji/AIO-gym-temp"
Issues = "https://github.com/zhuxinji/AIO-gym-temp/issues"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B009", "B905", "E402", "E702", "E731", "I001", "UP035", "UP037"]

[tool.ruff.lint.per-file-ignores]
"aiogym/controllers/__init__.py" = ["F401"]
"aiogym/evaluation/protocols.py" = ["F401"]
"aiogym/models/core.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["aiogym/tests"]
python_files = ["test_*.py"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
  "core: NumPy and Gymnasium core tests without optional dependencies",
  "rl: Torch and Stable-Baselines3 tests",
  "oracle: CasADi oracle tests",
  "onnx: ONNX and ONNX Runtime tests",
  "e2e: end-to-end pipeline tests",
  "slow: tests intentionally excluded from fast presubmit jobs",
]

[project.scripts]
aiogym = "aiogym.cli.main:main"

[tool.setuptools.packages.find]
include = ["aiogym*"]
exclude = ["aiogym.tests*"]

[tool.setuptools.package-data]
aiogym = [
  "controllers/configs/*.json",
  "models/examples/*.py",
  "models/examples/*.md",
  "models/parameters/*.json",
  "models/cases/builtin/*/*.json",
  "benchmarks/tracks/builtin/*.json",
  "benchmarks/anchors/builtin/*.json",
  "resources/profiles/**/*.json",
]
