[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiogym"
version = "0.33.1"
description = "Scenario-oriented process-control models, rewards, datasets, and workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "AIO-Gym Contributors" }
]

dependencies = [
  "gymnasium>=0.29",
  "numpy>=1.24",
]

[project.optional-dependencies]
rl = [
  "stable-baselines3>=2.3",
  "torch>=2.2",
]
test = [
  "pytest>=8.0",
]
# Compatibility alias; maintain RL dependencies in one place.
all = ["aiogym[rl]"]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.12",
  "wheel>=0.45",
]

[project.urls]
Homepage = "https://github.com/supcon-international/aiogym"
Documentation = "https://github.com/supcon-international/aiogym/blob/main/docs/quickstart.md"
Repository = "https://github.com/supcon-international/aiogym"
Issues = "https://github.com/supcon-international/aiogym/issues"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B009", "B905", "E402", "E702", "E731", "I001", "UP035", "UP037"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
  "rl: Torch and Stable-Baselines3 tests",
  "e2e: end-to-end pipeline tests",
]

[project.scripts]
aiogym = "aiogym.cli.main:main"

[tool.setuptools.packages.find]
include = ["aiogym*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"aiogym.rl" = ["configs/*.json"]
