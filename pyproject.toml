[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiogym"
version = "0.1.0"
description = "Native Gymnasium process-control environments and Track benchmarks for AIO-Gym."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "AIO-Gym Contributors" }
]

dependencies = [
  "gymnasium>=0.29",
  "numpy>=1.24",
]

[project.optional-dependencies]
oracle = [
  "casadi>=3.6",
]
rl = [
  "stable-baselines3>=2.3",
  "torch>=2.2",
]
onnx = [
  "onnx>=1.16",
  "onnxruntime>=1.17",
]
hpo = [
  "optuna>=4.0",
]
test = [
  "pytest>=8.0",
]
all = [
  "casadi>=3.6",
  "stable-baselines3>=2.3",
  "torch>=2.2",
  "onnx>=1.16",
  "onnxruntime>=1.17",
  "optuna>=4.0",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.12",
  "wheel>=0.45",
]

[project.urls]
Homepage = "https://github.com/zhuxinji/AIO-gym-temp"
Documentation = "https://github.com/zhuxinji/AIO-gym-temp/blob/main/docs/index.md"
Repository = "https://github.com/zhuxinji/AIO-gym-temp"
Issues = "https://github.com/zhuxinji/AIO-gym-temp/issues"

[tool.ruff]
target-version = "py310"
extend-exclude = ["aiogym/tests"]

[tool.ruff.lint]
select = ["F"]

[tool.ruff.lint.per-file-ignores]
"aiogym/controllers/__init__.py" = ["F401"]
"aiogym/evaluation/protocols.py" = ["F401"]
"aiogym/models/core.py" = ["F401"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
markers = [
  "core: NumPy and Gymnasium core tests without optional dependencies",
  "rl: Torch and Stable-Baselines3 tests",
  "oracle: CasADi oracle tests",
  "onnx: ONNX and ONNX Runtime tests",
  "e2e: end-to-end pipeline tests",
  "slow: tests intentionally excluded from fast presubmit jobs",
]

[project.scripts]
aiogym = "aiogym.cli.main:main"

[tool.setuptools]
packages = [
  "aiogym",
  "aiogym._environment",
  "aiogym._internal",
  "aiogym.cli",
  "aiogym.benchmarks",
  "aiogym.benchmarks.anchors",
  "aiogym.benchmarks.tracks",
  "aiogym.controllers",
  "aiogym.controllers.tuning",
  "aiogym.datasets",
  "aiogym.evaluation",
  "aiogym.evaluation.artifact",
  "aiogym.evaluation.execution",
  "aiogym.evaluation.metrics",
  "aiogym.experimental",
  "aiogym.generation",
  "aiogym.models",
  "aiogym.models.scenarios",
  "aiogym.models.cases",
  "aiogym.rewards",
  "aiogym.rl",
  "aiogym.rl.backends",
  "aiogym.tools",
]

[tool.setuptools.package-data]
aiogym = [
  "controllers/configs/*.json",
  "models/examples/*.py",
  "models/examples/*.md",
  "models/parameters/*.json",
  "models/cases/builtin/*/*.json",
  "benchmarks/tracks/builtin/*.json",
  "benchmarks/anchors/builtin/*.json",
]
