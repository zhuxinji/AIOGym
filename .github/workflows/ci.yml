name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q aiogym
      - run: python -m ruff check aiogym
      - run: python -m pytest -q -m "not rl and not oracle and not onnx and not e2e"
      - run: git diff --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/check_release_artifacts.py dist/*
      - run: python -m venv /tmp/aiogym-wheel-only
      - name: Install wheel outside the source tree
        working-directory: /tmp
        run: |
          /tmp/aiogym-wheel-only/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          /tmp/aiogym-wheel-only/bin/python -m pip check
      - name: Wheel-only import, CLI, resources, and environment smoke
        working-directory: /tmp
        run: |
          /tmp/aiogym-wheel-only/bin/python -c "import sys, aiogym; assert 'torch' not in sys.modules; assert 'stable_baselines3' not in sys.modules; print(aiogym.__version__)"
          /tmp/aiogym-wheel-only/bin/aiogym list scenarios
          /tmp/aiogym-wheel-only/bin/aiogym list tracks
          /tmp/aiogym-wheel-only/bin/aiogym list rewards
          /tmp/aiogym-wheel-only/bin/aiogym list profiles
          /tmp/aiogym-wheel-only/bin/aiogym describe reward regulation
          /tmp/aiogym-wheel-only/bin/python - <<'PY'
          import numpy as np
          import aiogym

          env = aiogym.make_env(
              "quadruple",
              case="minimum-phase",
              reward_spec="regulation",
          )
          try:
              observation, _ = env.reset(seed=0)
              action = np.asarray(
                  env.action_space.low
                  + 0.37 * (env.action_space.high - env.action_space.low),
                  dtype=env.action_space.dtype,
              )
              next_observation, reward, _, _, _ = env.step(action)
              assert observation.shape == env.observation_space.shape
              assert next_observation.shape == env.observation_space.shape
              assert float(reward) == float(reward)
          finally:
              env.close()
          PY

  rl-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[rl,test]"
      - run: python -m pytest -q -m "rl and not slow and not e2e"
      - name: Tiny BC and RLPD kernels plus SAC lifecycle smoke
        run: >-
          python -m pytest -q
          aiogym/tests/test_rl_phase_e.py::test_bc_reproduces_collector_on_tiny_dataset
          aiogym/tests/test_rl_phase_e.py::test_rlpd_batch_is_half_offline_half_online_in_canonical_mode
          aiogym/tests/e2e/test_collect_train_validate.py::test_sac_records_multiple_training_specs_and_valid_artifacts
