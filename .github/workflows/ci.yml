name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q aiogym
      - run: python -m ruff check aiogym tests scripts/migrate_dataset_v2_to_v3.py
      - run: python -m pytest -q
      - run: git diff --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/aiogym-wheel-only
      - name: Install wheel outside the source tree
        working-directory: /tmp
        run: |
          /tmp/aiogym-wheel-only/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          /tmp/aiogym-wheel-only/bin/python -m pip check
      - name: Wheel-only import, CLI, resources, and environment smoke
        working-directory: /tmp
        run: |
          /tmp/aiogym-wheel-only/bin/python -c "import sys, aiogym; assert 'torch' not in sys.modules; assert 'stable_baselines3' not in sys.modules; print(aiogym.__version__)"
          /tmp/aiogym-wheel-only/bin/aiogym list scenarios
          /tmp/aiogym-wheel-only/bin/aiogym list tasks
          /tmp/aiogym-wheel-only/bin/python - <<'PY'
          import numpy as np
          import aiogym

          env = aiogym.make_env(
              "quadruple/regulation",
              condition="minimum-phase",
          )
          try:
              observation, _ = env.reset(seed=0)
              action = np.asarray(
                  env.action_space.low
                  + 0.37 * (env.action_space.high - env.action_space.low),
                  dtype=env.action_space.dtype,
              )
              next_observation, reward, _, _, _ = env.step(action)
              assert observation.shape == env.observation_space.shape
              assert next_observation.shape == env.observation_space.shape
              assert float(reward) == float(reward)
              policy = aiogym.make_controller("pid", env=env)
              result = aiogym.evaluate(policy, seeds=(0,), max_steps=2)
              assert result["episodes"][0]["steps"] == 2
          finally:
              env.close()
          PY

  rl-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[rl,test]"
      - name: Supported algorithms and end-to-end workflow smoke
        run: python -m pytest -q tests/workflows/test_train.py tests/e2e/test_workflow_paths.py
