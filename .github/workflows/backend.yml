name: Backend checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core AIO-Gym and tests
        run: python -m pip install -e ".[test]"
      - name: Check core-only import
        run: >-
          python -c "import aiogym;
          env = aiogym.make_env('cstr');
          env.reset(seed=0);
          aiogym.make_controller('pid', scenario='cstr');
          aiogym.make_controller('mpc', scenario='cstr')"
      - name: Compile Python modules
        run: python -m compileall -q aiogym
      - name: Check CLI catalog
        run: |
          aiogym list scenarios
          aiogym list tracks
      - name: Run core suite without optional dependencies
        run: >-
          python -m pytest -q aiogym/tests
          -m 'not (rl or oracle or onnx or e2e or slow)'
      - name: Check patch whitespace
        run: git diff --check

  rl:
    runs-on: ubuntu-latest
    env:
      PYTHONPYCACHEPREFIX: /tmp/aiogym_pycache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[rl,test]"
      - run: python -m pytest -q aiogym/tests -m 'rl and not slow'

  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[oracle,test]"
      - run: python -m pytest -q aiogym/tests -m oracle

  onnx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[rl,onnx,test]"
      - run: python -m pytest -q aiogym/tests -m onnx

  release-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/aiogym-release-test
      - name: Install and smoke-test wheel in isolation
        run: |
          /tmp/aiogym-release-test/bin/python -m pip install --upgrade pip
          /tmp/aiogym-release-test/bin/pip install dist/*.whl
          /tmp/aiogym-release-test/bin/python -m pip check
          /tmp/aiogym-release-test/bin/aiogym --help
          /tmp/aiogym-release-test/bin/aiogym list scenarios
          /tmp/aiogym-release-test/bin/aiogym list cases
          /tmp/aiogym-release-test/bin/aiogym list tracks
          /tmp/aiogym-release-test/bin/aiogym list controllers
      - name: Verify installed package contract and runtime resources
        run: |
          /tmp/aiogym-release-test/bin/python - <<'PY'
          import aiogym
          from importlib.metadata import distribution, version
          from aiogym.benchmarks.anchors import (
              BUILTIN_ANCHOR_DIR,
              load_anchor_set,
          )
          from aiogym.controllers.configs import load_controller_config

          assert version("aiogym") == aiogym.__version__
          scripts = {
              entry.name: entry.value
              for entry in distribution("aiogym").entry_points
              if entry.group == "console_scripts"
          }
          assert scripts == {"aiogym": "aiogym.cli.main:main"}
          assert len(aiogym.list_scenarios()) == 8
          for scenario in aiogym.list_scenarios():
              env = aiogym.make_env(scenario)
              try:
                  observation, _ = env.reset(seed=0)
                  assert env.observation_space.contains(observation)
              finally:
                  env.close()
          for case_id in aiogym.list_cases():
              aiogym.load_case(case_id)
          for track_id in aiogym.list_tracks():
              aiogym.load_track(track_id)
          for path in BUILTIN_ANCHOR_DIR.glob("*.json"):
              load_anchor_set(path)
          for controller_id in ("pid", "mpc", "oracle"):
              assert load_controller_config(controller_id)
          PY
      - name: Build clean source ZIP and check archive hygiene
        shell: bash
        run: |
          version="$(/tmp/aiogym-release-test/bin/python -c 'import aiogym; print(aiogym.__version__)')"
          git archive --format=zip --prefix="aiogym-${version}/" --output="dist/aiogym-${version}-source.zip" HEAD
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          forbidden = ("__MACOSX", ".DS_Store", "__pycache__")

          def reject(names, artifact):
              bad = [
                  name for name in names
                  if any(part in forbidden or part.startswith("._") or part.endswith(".pyc")
                         for part in pathlib.PurePosixPath(name).parts)
              ]
              assert not bad, f"forbidden archive paths in {artifact}: {bad}"

          for artifact in pathlib.Path("dist").glob("*.whl"):
              with zipfile.ZipFile(artifact) as archive:
                  reject(archive.namelist(), artifact)
          for artifact in pathlib.Path("dist").glob("*-source.zip"):
              with zipfile.ZipFile(artifact) as archive:
                  reject(archive.namelist(), artifact)
          for artifact in pathlib.Path("dist").glob("*.tar.gz"):
              with tarfile.open(artifact) as archive:
                  reject(archive.getnames(), artifact)
          PY
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check aiogym

  nightly-e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[all,test]"
      - run: python -m pytest -q aiogym/tests -m 'e2e or slow'
