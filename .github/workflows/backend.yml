name: Backend checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    env:
      PYTHONPYCACHEPREFIX: /tmp/aiogym_pycache

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core AIO-Gym
        run: python -m pip install -e .
      - name: Check core-only import
        run: >-
          python -c "import aiogym;
          env = aiogym.make_env('cstr');
          env.reset(seed=0);
          aiogym.make_controller('pid', scenario='cstr');
          aiogym.make_controller('mpc', scenario='cstr')"
      - name: Install complete development stack
        run: python -m pip install -e ".[all,dev]"
      - name: Compile Python modules
        run: python -m compileall -q aiogym
      - name: Run static checks
        run: python -m ruff check aiogym
      - name: Build source and wheel distributions
        if: matrix.python-version == '3.12'
        run: python -m build --no-isolation --outdir /tmp/aiogym_dist
      - name: Check CLI catalog
        run: aiogym list scenarios
      - name: Run test suite
        run: python -m pytest -q aiogym/tests
      - name: Run benchmark smoke test
        run: >-
          aiogym benchmark suite
          standard-baselines
          --scenarios cstr
          --objectives tracking
          --controllers pid,mpc
          --episodes 1
          --episode-steps 2
          --artifact-dir /tmp/aiogym_suite_smoke
      - name: Validate benchmark artifacts
        run: aiogym artifacts check /tmp/aiogym_suite_smoke
      - name: Check patch whitespace
        run: git diff --check
